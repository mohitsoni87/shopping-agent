services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopping_agent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestion-api:
    build:
      context: .
      dockerfile: services/ingestion-api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/shopping_agent
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  agent-api:
    build:
      context: .
      dockerfile: services/agent-api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/shopping_agent
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
      args:
        VITE_AGENT_API_URL: http://localhost:8002
    ports:
      - "5173:5173"
    depends_on:
      - agent-api

volumes:
  pgdata:
