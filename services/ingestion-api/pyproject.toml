[project]
name = "ingestion-api"
version = "0.1.0"
description = "Webhook service that keeps the Feature Store in sync with tenant catalog updates."
requires-python = ">=3.11"
dependencies = [
    "shopping-agent-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
shopping-agent-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_api"]
