[project]
name = "agent-api"
version = "0.1.0"
description = "LangGraph conversational search agent over the tenant's Feature Store."
requires-python = ">=3.11"
dependencies = [
    "shopping-agent-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2.45",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.15",
    "python-dotenv>=1.0",
    "cachetools>=5.3",
]

[tool.uv.sources]
shopping-agent-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_api"]
