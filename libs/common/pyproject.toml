[project]
name = "shopping-agent-common"
version = "0.1.0"
description = "Shared domain layer for Shopping Agent services: db models, repositories, embeddings, catalog and search domain services."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "voyageai>=0.3.0",
    "fastapi>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopping_agent_common"]
