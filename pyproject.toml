[tool.uv.workspace]
members = ["libs/*", "services/*"]
exclude = ["services/web"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)`/`Header(...)` default-argument pattern is the
# framework's intended idiom, not the mutable-default footgun B008 targets.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
